name: Go Test and Report

on:
  push:
    branches: [ "main", "master" ] # 推送到主分支时触发
  pull_request:
    branches: [ "main", "master" ] # 提交 PR 到主分支时触发

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.26' # 根据你的项目实际 Go 版本修改，建议使用 1.19 以上
          cache: true # 开启依赖缓存，加速构建

      - name: Get dependencies
        run: go mod download

      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report/v2@latest

      # 核心：运行单测并生成报告
      # 重点解释：使用 $GITHUB_STEP_SUMMARY 可以将内容直接输出到 GitHub Action 页面的 "Summary" 标签页
      # 使用 >> 格式将 go test 的输出同时保存到文件，供后续 JUnit 报告解析
      - name: Run tests and generate raw output
        run: |
          go test -v -coverprofile=coverage.out ./... 2>&1 | tee test_output.txt
          echo "## Test Raw Output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate JUnit XML report
        run: |
          go-junit-report -in=test_output.txt -out=junit_report.xml
          
      - name: Publish JUnit Test Report
        uses: mikepenz/action-junit-report@v4
        if: always() # 即使前面单测失败，也要继续执行这一步来生成报告
        with:
          report_paths: junit_report.xml
          require_tests: true
          detailed_summary: true
          include_time_in_summary: true

      - name: Generate Coverage Summary
        if: always()
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Coverage: $COVERAGE**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

